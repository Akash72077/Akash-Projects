<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<header>

    <a href="#" class="logo">Shop<span>Easy</span></a>

    <ul class="navbar">
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Categories</a></li>
        <li><a href="#">Offers</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <form class="search-box">
        <input type="text" placeholder="Search Products...">
        <button type="submit">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </form>

    <i class="fa-solid fa-bars" id="menu-icon"></i>

</header>

<section class="hero">

    <div class="overlay">

        <h1>Big Sale is Live!</h1>

        <p>Up to 70% OFF on Electronics, Fashion & Accessories</p>

        <a href="#" class="shop-btn">Shop Now</a>

    </div>

</section>

<section class="products">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="">
        <h3>Sports Shoes</h3>
        <p>$59</p>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="">
        <h3>Smart Watch</h3>
        <p>$99</p>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" alt="">
        <h3>Smart Phone</h3>
        <p>$699</p>
    </div>

</section>

</body>
</html>
